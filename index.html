
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090B">
<title>VYRA — A New Form of Existence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#08090B;
  --graphite:#202329;
  --platinum:#AEB4BE;
  --white:#F4F5F7;
  --ice:#8496B5;
  --steel:#343A42;
  --blue:#667FA7;
  --violet:#514A79;
  --font:'Space Grotesk',sans-serif;
  --body:'Inter',sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--black)}
body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:var(--body);
  overflow-x:hidden;
}
::selection{background:var(--ice);color:var(--black)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{width:100%;height:100%;display:block;object-fit:cover}
.container{width:min(1320px,86%);margin:auto}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:var(--font);font-weight:400}

.eyebrow{
  font:500 10px var(--font);
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--ice);
}
.reveal{
  opacity:0;
  transform:translateY(42px);
  transition:opacity 1s var(--ease),transform 1.15s var(--ease);
}
.reveal.visible{opacity:1;transform:translateY(0)}

/* CURSOR */
.cursor,.cursor-ring{
  position:fixed;
  pointer-events:none;
  z-index:999;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.cursor{
  width:7px;height:7px;
  background:var(--ice);
}
.cursor-ring{
  width:30px;height:30px;
  border:1px solid rgba(174,180,190,.5);
  transition:width .35s var(--ease),height .35s var(--ease),border-color .3s;
}
body.hovering .cursor-ring{
  width:52px;height:52px;
  border-color:var(--ice);
}
@media(hover:none){.cursor,.cursor-ring{display:none}}

/* HEADER */
header{
  position:absolute;
  top:0;left:0;width:100%;
  z-index:100;
  padding:30px 0;
}
.nav{
  width:88%;
  max-width:1440px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font:600 27px var(--font);
  letter-spacing:.17em;
}
.nav-links{
  display:flex;
  gap:38px;
}
.nav-links a,.nav-contact{
  font:500 10px var(--font);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(244,245,247,.76);
  transition:color .3s;
}
.nav-links a:hover,.nav-contact:hover{color:var(--ice)}
.nav-contact{
  padding-bottom:8px;
  border-bottom:1px solid var(--ice);
}
.menu-toggle{display:none;font-size:25px}

/* HERO */
.hero{
  min-height:880px;
  height:100svh;
  max-height:1100px;
  position:relative;
  display:flex;
  align-items:center;
  isolation:isolate;
  overflow:hidden;
  background:var(--black);
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,#08090B 0%,rgba(8,9,11,.93) 27%,rgba(8,9,11,.5) 58%,rgba(8,9,11,.12) 100%),
    linear-gradient(0deg,#08090B 0%,transparent 32%,rgba(8,9,11,.25) 100%),
    url("assets/hero-bag.png") center 48%/cover no-repeat;
  transform:scale(1.035);
  animation:heroMovement 19s ease-in-out infinite alternate;
}
.hero::after{
  content:"";
  position:absolute;
  width:48%;
  height:70%;
  right:2%;
  top:12%;
  z-index:-1;
  background:radial-gradient(ellipse,rgba(102,127,167,.16),rgba(81,74,121,.07) 40%,transparent 72%);
  filter:blur(35px);
}
@keyframes heroMovement{
  from{transform:scale(1.035) translate3d(0,0,0)}
  to{transform:scale(1.105) translate3d(-1%,.5%,0)}
}
.hero-content{
  width:86%;
  max-width:1320px;
  margin:85px auto 0;
  position:relative;
}
.hero-kicker{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:36px;
}
.live-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--ice);
  box-shadow:0 0 14px var(--ice);
  animation:signal 2s infinite;
}
@keyframes signal{50%{opacity:.3}}
.hero-kicker span:last-child{
  font:500 10px var(--font);
  letter-spacing:.22em;
  color:var(--platinum);
}
.hero h1{
  font-size:clamp(78px,11vw,156px);
  line-height:.79;
  letter-spacing:-.09em;
  text-transform:uppercase;
  margin:0;
}
.hero h1 .outline{
  color:transparent;
  -webkit-text-stroke:1px rgba(244,245,247,.8);
}
.hero h1 .accent{
  color:var(--ice);
}
.hero-bottom{
  display:flex;
  justify-content:space-between;
  align-items:end;
  max-width:900px;
  margin-top:56px;
}
.hero-description{
  max-width:335px;
  color:rgba(244,245,247,.68);
  font-size:13px;
  font-weight:300;
  line-height:1.9;
  margin:0;
}
.hero-link{
  display:inline-flex;
  align-items:center;
  gap:0;
  border-bottom:1px solid var(--ice);
  padding-bottom:11px;
  font:500 10px var(--font);
  letter-spacing:.2em;
  text-transform:uppercase;
  transition:color .3s;
}
.hero-link:hover{color:var(--ice)}
.hero-index{
  position:absolute;
  right:5%;
  bottom:75px;
  writing-mode:vertical-rl;
  font:10px var(--font);
  letter-spacing:.2em;
  color:rgba(244,245,247,.45);
}

/* STRAIGHT TICKER */
.ticker{
  width:100%;
  position:relative;
  overflow:hidden;
  background:var(--ice);
  color:var(--black);
  padding:17px 0;
  margin:0;
  transform:none;
}
.ticker-track{
  display:flex;
  width:max-content;
  animation:tickerMove 25s linear infinite;
}
.ticker-group{
  display:flex;
  flex-shrink:0;
  align-items:center;
}
.ticker-word{
  display:flex;
  align-items:center;
  gap:34px;
  padding:0 32px;
  white-space:nowrap;
  font:600 12px var(--font);
  letter-spacing:.2em;
}
.ticker-word i{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--black);
}
@keyframes tickerMove{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
.ticker:hover .ticker-track{animation-play-state:paused}

/* ORIGIN */
.manifesto{padding:175px 0 165px}
.manifesto-grid{
  display:grid;
  grid-template-columns:.72fr 2fr;
  gap:8%;
}
.manifesto-note{padding-top:12px}
.manifesto-note p{
  max-width:225px;
  margin-top:26px;
  color:rgba(244,245,247,.48);
  font-size:12px;
  line-height:1.9;
}
.manifesto h2{
  font-size:clamp(48px,7.2vw,100px);
  line-height:.97;
  letter-spacing:-.075em;
  text-transform:uppercase;
  margin:0;
}
.manifesto h2 em{
  font-style:normal;
  color:var(--ice);
}
.manifesto-foot{
  display:flex;
  justify-content:flex-end;
  margin-top:43px;
}
.manifesto-foot p{
  max-width:340px;
  color:rgba(244,245,247,.53);
  font-size:12px;
  line-height:1.9;
}

/* PARASITE */
.parasite{
  min-height:790px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:#050608;
}
.parasite-visual{
  position:absolute;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(90deg,#050608 0%,rgba(5,6,8,.8) 31%,rgba(5,6,8,.18) 100%),
    linear-gradient(0deg,#050608 0%,transparent 42%),
    url("assets/bag-parasite.png") center/cover no-repeat;
  transform:scale(1.025);
  transition:transform 2s var(--ease);
}
.parasite:hover .parasite-visual{transform:scale(1.07)}
.parasite-content{
  width:86%;
  max-width:1320px;
  margin:auto;
  padding:130px 0;
}
.parasite h2{
  font-size:clamp(90px,15vw,210px);
  line-height:.75;
  letter-spacing:-.105em;
  margin:30px 0 45px;
}
.parasite h2 span{
  display:block;
  color:var(--ice);
  margin-left:12vw;
}
.parasite-bottom{
  display:flex;
  justify-content:space-between;
  align-items:end;
  max-width:900px;
}
.parasite-bottom p{
  max-width:320px;
  color:rgba(244,245,247,.68);
  font-size:13px;
  line-height:1.9;
}
.parasite-number{
  font:10px var(--font);
  letter-spacing:.2em;
  color:var(--platinum);
}

/* FOUR CONCEPTS */
.collection{padding:165px 0 175px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:70px;
}
.section-head h2{
  font-size:clamp(52px,8vw,108px);
  letter-spacing:-.085em;
  line-height:.83;
  margin:20px 0 0;
}
.section-head p{
  max-width:225px;
  margin:0 0 5px;
  color:rgba(244,245,247,.5);
  font-size:12px;
  line-height:1.85;
}

/* Editorial asymmetric grid */
.concept-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:8%;
  row-gap:105px;
  align-items:start;
}
.concept:nth-child(2){margin-top:115px}
.concept:nth-child(3){margin-top:-55px}
.concept:nth-child(4){margin-top:60px}

.concept-image{
  position:relative;
  overflow:hidden;
  background:#10121A;
  aspect-ratio: .91 / 1;
  isolation:isolate;
}
.concept:nth-child(2) .concept-image{aspect-ratio:1.02 / 1}
.concept:nth-child(3) .concept-image{aspect-ratio:.94 / 1}
.concept:nth-child(4) .concept-image{aspect-ratio:1.02 / 1}

.concept-image img{
  transition:transform 1.5s var(--ease),filter 1.2s;
  filter:brightness(.9) saturate(.9);
}
.concept:hover .concept-image img{
  transform:scale(1.065);
  filter:brightness(1.05) saturate(1.12);
}
.concept-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,rgba(132,150,181,.15),transparent 35%,rgba(8,9,11,.2));
  mix-blend-mode:screen;
  opacity:.7;
  transition:opacity .6s;
}
.concept:hover .concept-image::after{opacity:1}
.concept-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  margin-top:24px;
}
.concept h3{
  font-size:clamp(29px,4vw,48px);
  letter-spacing:-.065em;
  margin:0;
}
.concept-id{
  font:10px var(--font);
  color:var(--ice);
  letter-spacing:.15em;
  white-space:nowrap;
}
.concept-desc{
  max-width:330px;
  color:rgba(244,245,247,.48);
  font-size:11px;
  line-height:1.85;
  margin:12px 0 0;
}

/* LIQUID */
.liquid-break{
  min-height:680px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    linear-gradient(90deg,rgba(8,9,11,.92),rgba(8,9,11,.35) 75%),
    linear-gradient(0deg,rgba(8,9,11,.55),transparent),
    url("assets/bag-liquid.png") center/cover no-repeat;
}
.liquid-break::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 35%,rgba(81,74,121,.12),transparent);
  animation:liquidLight 9s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes liquidLight{
  from{transform:translateX(-15%)}
  to{transform:translateX(15%)}
}
.liquid-text{
  width:86%;
  max-width:1320px;
  margin:auto;
  position:relative;
  z-index:2;
}
.liquid-text h2{
  font-size:clamp(100px,19vw,260px);
  line-height:.76;
  letter-spacing:-.115em;
  margin:28px 0 0;
}
.liquid-text p{
  margin:42px 0 0 8px;
  font:10px var(--font);
  letter-spacing:.22em;
  color:var(--platinum);
}

/* STATEMENT */
.statement{
  padding:175px 0;
  text-align:center;
}
.statement h2{
  font-size:clamp(54px,9vw,126px);
  line-height:.9;
  letter-spacing:-.09em;
  margin:35px 0 0;
}
.statement h2 span{
  color:var(--ice);
}
.statement p{
  max-width:380px;
  margin:42px auto 0;
  color:rgba(244,245,247,.5);
  font-size:12px;
  line-height:1.9;
}

/* LEXICON */
.lexicon{padding:55px 0 165px}
.lexicon-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:50px;
}
.lexicon-heading h2{
  font-size:clamp(48px,7vw,92px);
  letter-spacing:-.085em;
  margin:18px 0 0;
}
.lexicon-heading p{
  max-width:210px;
  color:rgba(244,245,247,.48);
  font-size:11px;
  line-height:1.85;
}
.lexicon-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  column-gap:35px;
}
.lexicon-item{
  padding:23px 0;
  border-top:1px solid rgba(174,180,190,.2);
  transition:border-color .35s,transform .4s var(--ease);
}
.lexicon-item:hover{
  border-color:var(--ice);
  transform:translateY(-4px);
}
.lexicon-item span{
  display:block;
  font:10px var(--font);
  letter-spacing:.17em;
  color:var(--ice);
  margin-bottom:15px;
}
.lexicon-item h3{
  font-size:21px;
  letter-spacing
